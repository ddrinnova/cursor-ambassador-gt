name: Deploy to R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-r2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm run build

      - name: Sync out/ to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          aws s3 sync out/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$ENDPOINT" \
            --delete

          # R2 custom domains don't resolve directory index.html.
          # Upload extensionless HTML copies so /agenda and /recaps/slug work.
          while IFS= read -r -d '' file; do
            rel="${file#out/}"
            [[ "$rel" == "index.html" || "$rel" == "404.html" || "$rel" == "_not-found.html" ]] && continue
            key="${rel%.html}"
            echo "Publishing pretty URL: /$key"
            aws s3 cp "$file" "s3://${R2_BUCKET}/${key}" \
              --endpoint-url "$ENDPOINT" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done < <(find out -type f -name '*.html' -print0)
